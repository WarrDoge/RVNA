{{- if .Values.route.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "rvna.fullname" . }}
  labels:
    {{- include "rvna.labels" . | nindent 4 }}
spec:
  {{- if not .Values.route.parentRefs }}
  {{- fail "route.parentRefs is required when route.enabled is true" }}
  {{- end }}
  parentRefs:
    {{- toYaml .Values.route.parentRefs | nindent 4 }}
  hostnames:
    - {{ .Values.route.hostname | quote }}
    {{- range .Values.route.extraHostnames }}
    - {{ . | quote }}
    {{- end }}
  rules:
    - backendRefs:
        - name: {{ include "rvna.fullname" . }}
          port: 3000
{{- end }}
